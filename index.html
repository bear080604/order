<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Canteen Menu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Dashboard -->
    <div id="main-screen" class="screen active">
        <header>
            <div class="header-content">
                <h1>🍽️ Canteen Menu</h1>
                <p class="current-date" id="current-date"></p>
            </div>
            <button class="add-btn" id="add-btn" title="Thêm thực đơn">+</button>
        </header>
        <div class="user-list" id="user-list">
            <p class="loading">Đang tải dữ liệu</p>
        </div>
    </div>

    <!-- User Detail Screen -->
    <div id="detail-screen" class="screen">
        <header>
            <button class="back-btn" id="back-btn" title="Quay lại">←</button>
            <div class="header-content">
                <h1 id="detail-name"></h1>
                <p id="detail-id"></p>
            </div>
        </header>
        <div class="date-selector">
            <input type="date" id="date-picker" />
        </div>
        <div class="menu-display">
            <div class="meal-item">
                <span class="meal-icon">☀️</span>
                <div class="meal-content">
                    <h3>Món Sáng</h3>
                    <p id="sang-meal">Chưa có dữ liệu</p>
                </div>
            </div>
            <div class="meal-item">
                <span class="meal-icon">🍲</span>
                <div class="meal-content">
                    <h3>Món Trưa</h3>
                    <p id="trua-meal">Chưa có dữ liệu</p>
                </div>
            </div>
            <div class="meal-item">
                <span class="meal-icon">🧃</span>
                <div class="meal-content">
                    <h3>Món Xế</h3>
                    <p id="xe-meal">Chưa có dữ liệu</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Import JSON -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Thêm Thực Đơn</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <textarea id="json-input" placeholder='Dán dữ liệu JSON tại đây...

Ví dụ:
{
  "id": "26005656",
  "name": "NGUYỄN VĂN A",
  "menu": {
    "2026-08-10": {
      "sang": "Phở gà",
      "trua": "Cơm tấm",
      "xe": "Bánh mì"
    }
  }
}'></textarea>
            <div class="modal-actions">
                <button class="save-btn" id="save-btn">💾 Lưu & Cập nhật</button>
            </div>
            <p class="modal-message" id="modal-message"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
