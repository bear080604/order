<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Nữ Xung Kích - Theo dõi Thực đơn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="main.css?v=5">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <i class="fas fa-utensils header-icon"></i>
            <h1 class="header-title">4 Nữ Xung Kích</h1>
        </div>
        <button class="add-btn" onclick="openModal()">
            <i class="fas fa-plus"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main>
        <div class="page-header">
            <h2 class="page-title">Theo dõi Thực đơn</h2>
            <p class="page-subtitle" id="currentDate">Hôm nay, 20-05-2024</p>
        </div>

        <!-- Employee Grid -->
        <div class="employee-grid" id="employeeGrid">
            <p class="loading">Đang tải dữ liệu...</p>
        </div>
    </main>

    <!-- JSON Modal -->
    <div class="modal" id="jsonModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">📝 Nhập dữ liệu JSON</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-description">Dán chuỗi JSON chứa thông tin nhân viên và thực đơn vào ô bên dưới để cập nhật nhanh.</p>
                <textarea class="json-input" placeholder='{
  "id": "26005656",
  "name": "NGUYỄN VĂN A",
  "menu": {
    "2026-08-10": {
      "sang": "Phở gà",
      "trua": "Cơm tấm",
      "xe": "Bánh mì"
    }
  }
}'></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                <button class="btn btn-primary" onclick="handleJSONSubmit()">Xác nhận</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
